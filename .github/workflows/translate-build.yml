# Build image máy dịch riêng ghcr.io/tritue2011/vn-translate — chỉ chạy khi
# vn-translate/ đổi, tách khỏi build image chính cho nhẹ.
name: build-vn-translate
on:
  push:
    branches: [main]
    paths: ["vn-translate/**", ".github/workflows/translate-build.yml"]
  workflow_dispatch:
concurrency:
  group: vn-translate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: vn-translate
          push: true
          tags: |
            ghcr.io/tritue2011/vn-translate:latest
            ghcr.io/tritue2011/vn-translate:sha-${{ github.sha }}

  # Bản GPU (máy NVR .220). PHẢI chạy sau job trên: Dockerfile.gpu lấy thư mục
  # EnViT5 đã convert từ chính image CPU vừa đẩy lên, nên bản CPU phải có mặt
  # trên ghcr trước. Nền CUDA nặng ~3 GB — runner ubuntu-latest còn ~14 GB
  # trống nên đủ; hết chỗ thì thêm bước dọn đĩa trước khi build.
  gpu:
    needs: build
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      # Nền CUDA nặng — cùng bước dọn mà job build-gpu của image chính dùng.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: vn-translate
          file: vn-translate/Dockerfile.gpu
          push: true
          tags: |
            ghcr.io/tritue2011/vn-translate-gpu:latest
            ghcr.io/tritue2011/vn-translate-gpu:sha-${{ github.sha }}
