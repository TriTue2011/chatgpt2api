# Build image máy dịch riêng ghcr.io/tritue2011/vn-translate — chỉ chạy khi
# vn-translate/ đổi, tách khỏi build image chính cho nhẹ.
name: build-vn-translate
on:
  push:
    branches: [main]
    paths: ["vn-translate/**", ".github/workflows/translate-build.yml"]
  workflow_dispatch:
concurrency:
  group: vn-translate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: vn-translate
          push: true
          tags: |
            ghcr.io/tritue2011/vn-translate:latest
            ghcr.io/tritue2011/vn-translate:sha-${{ github.sha }}
