# Build API source-separation GPU. Model không nướng vào image; tải lần đầu
# vào bind mount /data/models trên máy GPU.
name: build-fw-tach-am
on:
  push:
    branches: [main]
    paths: ["fw-tach-am/**", "test/test_fw_tach_am.py", ".github/workflows/fw-tach-am-build.yml"]
  workflow_dispatch:
concurrency:
  group: fw-tach-am-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Test API contract and process ownership
        run: |
          python -m pip install --disable-pip-version-check pytest fastapi==0.136.0
          python -m pytest -q test/test_fw_tach_am.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: fw-tach-am
          push: true
          tags: |
            ghcr.io/tritue2011/fw-tach-am:latest
            ghcr.io/tritue2011/fw-tach-am:sha-${{ github.sha }}
