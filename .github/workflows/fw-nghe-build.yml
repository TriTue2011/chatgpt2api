# Build image máy NGHE chạy GPU ghcr.io/tritue2011/fw-nghe — chỉ chạy khi
# fw-nghe/ đổi, tách khỏi build image chính cho nhẹ (cùng nếp translate-build).
#
# Build KHÔNG cần card NVIDIA: nền CUDA chỉ là thư viện, card chỉ cần lúc chạy.
# Model large-v3 (~3 GB) KHÔNG nướng vào image — nó tải lần đầu vào volume
# `fw-nghe-data`, nên image ở mức ~4 GB thay vì 7 GB và đổi code không phải
# đẩy lại model.
name: build-fw-nghe
on:
  push:
    branches: [main]
    paths: ["fw-nghe/**", ".github/workflows/fw-nghe-build.yml"]
  workflow_dispatch:
concurrency:
  group: fw-nghe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      # Nền nvidia/cuda ~3 GB + gói pip: runner ubuntu-latest hay thiếu chỗ.
      # Cùng bước dọn mà job build-gpu của image chính đang dùng.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: fw-nghe
          push: true
          tags: |
            ghcr.io/tritue2011/fw-nghe:latest
            ghcr.io/tritue2011/fw-nghe:sha-${{ github.sha }}
