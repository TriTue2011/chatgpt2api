name: Publish Docker Image

# Trigger on push to main (source changes) AND version tags (releases)
on:
  push:
    branches:
      - main
    # vn-mcp-hub + captcha-solver are part of this single image, so changes to
    # them must rebuild here too. Only docs are ignored.
    paths-ignore:
      - "**.md"
    tags:
      - "v*"
  workflow_dispatch:

# Serialize theo nhánh: push dồn dập (nhiều commit liên tiếp) trước đây tạo ra
# hàng loạt run BUILD chạy SONG SONG, cùng push image lớn lên GHCR một lúc →
# tranh chấp registry, một số run nhận `denied: 403 Forbidden` ở bước push (đo
# 07/08: build OK, chỉ push fail). Nhóm concurrency + cancel-in-progress khiến
# chỉ commit MỚI NHẤT build tới cùng; commit cũ đang chạy bị HUỶ (không tính là
# fail), nên không còn chồng chéo và không còn 403 do tranh chấp.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR refs must be lowercase; github.repository_owner is "TriTue2011" (mixed
  # case) which fails push-by-digest with "repository name must be lowercase".
  # Hardcode the lowercased owner.
  REGISTRY_IMAGE: ghcr.io/tritue2011/chatgpt2api

jobs:
  # Gate: hermetic unit tests (pytest) + web typecheck TRƯỚC khi build image.
  # Chỉ chạy subset test không cần server sống (test_v1_*.py là integration —
  # cần localhost:8000; test_account_image_capabilities.py có test stale so với
  # AccountService hiện tại). Typecheck = tsc --noEmit (nhanh); next build đầy
  # đủ đã có trong Docker build stage.
  test:
    runs-on: ubuntu-latest
    # 25 phút, không phải 10. Đo 06-07/08: bốn lượt liên tiếp chết ở đúng mốc 10
    # phút vì HẾT GIỜ thật (không phải bị huỷ). LƯU Ý: nay ĐÃ thêm khối
    # `concurrency` ở đầu file — push chồng sẽ huỷ lượt cũ (trạng thái
    # "cancelled", không phải "failure").
    #
    # Phần lâu không phải là test (cả bộ chạy ~27 giây trong container): nó là
    # `uv sync --frozen` + cài Bun + typecheck web, cộng lúc runner GitHub tắc.
    # Cắt bớt test để vừa 10 phút là cắt nhầm chỗ — cổng chặn mất tác dụng mà
    # nguyên nhân vẫn còn.
    timeout-minutes: 25
    env:
      # pyproject ghim mirror aliyun (nhanh ở VN, chậm trên GH runner) — ép PyPI.
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install Python deps
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run python -m pytest test/test_backend_router.py test/test_auth_service.py test/test_config.py test/test_provider_circuit.py test/test_session_affinity.py test/test_mcp_tool_exec.py test/test_zalo_bot_webhook.py test/test_zalo_bot_send.py test/test_zalo_bot_webhook_mode.py test/test_tim_nguon_theo_loai.py test/test_khoi_phuc_captcha.py test/test_nhieu_anh_mot_luot.py test/test_mcp_search_backend.py test/test_nap_sach_khong_theo_tap.py test/test_auto_login_buoc_mat_khau.py test/test_khoi_phuc_khong_nhieu_tang_vo_ich.py test/test_khoi_phuc_khong_do_loi_google_oan.py test/test_ho_so_ban_khong_treo_im.py test/test_dien_email_truoc_khi_bam_tile.py test/test_flow_dung_dung_model.py test/test_flow_anh_dung_khung_hinh.py test/test_flow_anh_di_duong_rest.py test/test_flow_video_di_duong_rest.py test/test_flow_session_scan.py test/test_flow_khong_tao_nham_loai.py test/test_flow_anh_va_video_khong_lan.py test/test_flow_rest_than_yeu_cau.py test/test_flow_ban_khong_phai_mat_phien.py test/test_tat_tao_media.py test/test_video_loi_thoai_viet.py test/test_video_noi_khung_cuoi.py test/test_ask_choices_khong_cat_prompt.py test/test_provider_order.py test/test_khong_hoi_som_tai_khoan.py test/test_ocr_rules.py test/test_loa_du_thong_tin.py test/test_combo_tu_don_provider.py test/test_uu_tien_goi_cao_dung_truoc.py test/test_giong_theo_loa_va_phien.py test/test_lich_doc_ra_loa.py test/test_xem_va_huy_lich_nhac.py test/test_chat_luong_skill.py test/test_quyen_admin_khong_theo_nhom.py test/test_pham_vi_memory_theo_dinh_danh.py test/test_pham_vi_du_lieu.py test/test_pham_vi_qua_tool.py test/test_pham_vi_tri_nho.py test/test_sua_dieu_da_ghi_nho.py test/test_khoa_phien_mot_cho.py test/test_luat_gitleaks.py test/test_di_tru_pham_vi.py test/test_pdf_inspector_cuc_bo.py test/test_anydoc_office_cuc_bo.py test/test_ket_noi_bo_nho.py test/test_ket_noi_qua_tool.py test/test_ap_so_thich_trinh_bay.py test/test_pham_vi_memory_service.py test/test_zalo_poll_retry.py test/test_vi_text.py test/test_chatlog.py test/test_chatlog_tools.py test/test_chatlog_nhac.py test/test_luu_tru_online.py test/test_luu_tru_day.py test/test_nhat_ky_dong_bo.py test/test_kho_theo_pham_vi.py test/test_cho_sau_tag.py test/test_tach_hoi_thoai_trong_nhom.py test/test_y_dinh_luu_online.py test/test_cho_anh_khong_tag.py test/test_yeu_cau_moi.py test/test_office_bo_sung.py test/test_ha_anh_bo_prompt_he_thong.py test/test_o_tich_du_moi_nhom.py test/test_mot_cho_dang_ky_thread.py test/test_nhan_tep_ngam.py test/test_giu_cau_user_khi_cat_payload.py test/test_ssrf_va_path_traversal.py test/test_xff_va_co_internal.py test/test_egress_scheme_va_forwarded_host.py test/test_dos_limits.py test/test_config_mutate.py test/test_tls_verify_register.py test/test_email_allowlist.py test/test_role_tool_ceiling.py test/test_ha_fastpath_role_gate.py test/test_code_exec_default_off.py test/test_ingress_guard.py test/test_url_guard_ssrf.py test/test_mcp_cache_hub_chua_len.py test/test_ssh_tofu.py test/test_image_guard.py test/test_image_task_queue.py test/test_telegram_egress_limits.py test/test_video_limits.py test/test_doc_guard.py test/test_model_list_free_tier.py test/test_vision_khong_bia_ket_qua.py test/test_response_format.py test/test_branch_khong_ghim_cung.py test/test_vision_ingress_va_model_sai.py test/test_captcha_key_health.py test/test_phien_trinh_duyet.py test/test_settings_khong_lo_secret.py test/test_doi_thu_tu_khoa.py test/test_ve_sse_va_media_ky.py test/test_vault_tai_khoan.py test/test_csp.py test/test_dockerfile_chuoi_cung_ung.py test/test_gemini_khong_tu_chen_search.py test/test_images_co_kiem_soat.py test/test_model_tim_kiem.py test/test_xoay_khoa_tim_kiem.py test/test_non_root_va_image_size.py test/test_khong_mat_pool_khoa.py -q

      # RBAC của zalo-server là code Node, pytest không chạm tới. Test dùng
      # runner có sẵn của Node (`node --test`), không thêm dependency nào.
      - name: Zalo-server RBAC tests
        working-directory: zalo-server
        run: node --test test/rbac.test.js

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # CỔNG CHẶN CỨNG từ 08/08/2026: 26 lỗi type sẵn có đã dọn hết và
      # `ignoreBuildErrors` đã gỡ khỏi next.config.ts, nên `next build` trong
      # Docker cũng tự fail khi có lỗi type. Bước này chỉ để phát hiện SỚM
      # (30 giây) thay vì chờ hết một lượt build image ~30 phút.
      #
      # npm ci (không phải bun) từ 08/08/2026: image cũng build bằng npm ci nên
      # cổng này và image nói về CÙNG một cây phụ thuộc. Trước đây image dùng
      # bun.lock còn audit đọc package-lock.json — audit mô tả thứ không chạy.
      - name: Web typecheck (gate)
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit

      # Chỉ CRITICAL mới chặn. `--omit=dev` là chủ ý: web xuất bản TĨNH
      # (next.config `output: 'export'`), nên devDependencies không đi vào
      # image và không phục vụ request nào — để chúng chặn merge là biến cổng
      # này thành thứ người ta quen bỏ qua.
      - name: Web audit (critical chặn)
        working-directory: web
        run: npm audit --omit=dev --audit-level=critical

      # Báo cáo mức high, KHÔNG chặn — để thấy mà xử lý có kế hoạch.
      - name: Web audit (high — chỉ báo cáo)
        working-directory: web
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Zalo-server audit (critical chặn)
        working-directory: zalo-server
        run: npm audit --omit=dev --audit-level=critical

  # Build each architecture on its NATIVE runner (fast; no QEMU emulation of the
  # ~9GB browser+ML image). arm64 uses GitHub's free hosted arm64 runner
  # (public repos). Each leg pushes a digest-only image; `merge` stitches them
  # into one multi-arch manifest. Google Chrome is amd64-only, so the Dockerfile
  # installs Debian chromium on arm64 (TARGETARCH branch).
  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: app
          platforms: ${{ matrix.platform }}
          # gha cache previously served a stale services/ layer; keep off so the
          # image always contains the committed code (~1m slower).
          no-cache: true
          # GH runner ở Mỹ: mirror aliyun (default trong pyproject) hay timeout
          # (vnstock, posthog) — ép PyPI chính hãng như job test.
          build-args: |
            UV_DEFAULT_INDEX=https://pypi.org/simple
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Image GPU (amd64-only, tag :gpu): thêm torch CUDA + transformers để VieNeu
  # tự chạy PyTorch/GPU (vieneu_backend=auto). Tách tag riêng — image thường
  # giữ nguyên nhẹ. Image ~15GB nên phải dọn đĩa runner trước khi build.
  build-gpu:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push :gpu
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: app
          platforms: linux/amd64
          no-cache: true
          build-args: |
            GPU=1
            UV_DEFAULT_INDEX=https://pypi.org/simple
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:gpu

  # Stitch the per-arch digests into a single multi-arch manifest with the real
  # tags (latest / sha- / version). Only runs if BOTH arch builds succeed, so a
  # broken arm64 leg never overwrites the working amd64 `latest`.
  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect published manifest
        run: docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
