name: Publish Docker Image

# Trigger on push to main (source changes) AND version tags (releases)
on:
  push:
    branches:
      - main
    # vn-mcp-hub + captcha-solver are part of this single image, so changes to
    # them must rebuild here too. Only docs are ignored.
    paths-ignore:
      - "**.md"
    tags:
      - "v*"
  workflow_dispatch:

# Serialize theo nhánh: push dồn dập (nhiều commit liên tiếp) trước đây tạo ra
# hàng loạt run BUILD chạy SONG SONG, cùng push image lớn lên GHCR một lúc →
# tranh chấp registry, một số run nhận `denied: 403 Forbidden` ở bước push (đo
# 07/08: build OK, chỉ push fail). Nhóm concurrency + cancel-in-progress khiến
# chỉ commit MỚI NHẤT build tới cùng; commit cũ đang chạy bị HUỶ (không tính là
# fail), nên không còn chồng chéo và không còn 403 do tranh chấp.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR refs must be lowercase; github.repository_owner is "TriTue2011" (mixed
  # case) which fails push-by-digest with "repository name must be lowercase".
  # Hardcode the lowercased owner.
  REGISTRY_IMAGE: ghcr.io/tritue2011/chatgpt2api

jobs:
  # Gate: hermetic unit tests (pytest) + web typecheck TRƯỚC khi build image.
  # Chạy toàn bộ test/ trừ test_v1_*.py (integration — cần localhost:8000) và
  # test_account_image_capabilities.py (có test stale so với AccountService
  # hiện tại). Typecheck = tsc --noEmit (nhanh); next build đầy đủ đã có trong
  # Docker build stage.
  test:
    runs-on: ubuntu-latest
    # 25 phút, không phải 10. Đo 06-07/08: bốn lượt liên tiếp chết ở đúng mốc 10
    # phút vì HẾT GIỜ thật (không phải bị huỷ). LƯU Ý: nay ĐÃ thêm khối
    # `concurrency` ở đầu file — push chồng sẽ huỷ lượt cũ (trạng thái
    # "cancelled", không phải "failure").
    #
    # Phần lâu không phải là test (cả bộ chạy ~27 giây trong container): nó là
    # `uv sync --frozen` + cài Bun + typecheck web, cộng lúc runner GitHub tắc.
    # Cắt bớt test để vừa 10 phút là cắt nhầm chỗ — cổng chặn mất tác dụng mà
    # nguyên nhân vẫn còn.
    timeout-minutes: 25
    env:
      # pyproject ghim mirror aliyun (nhanh ở VN, chậm trên GH runner) — ép PyPI.
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install Python deps
        run: uv sync --frozen

      - name: Run unit tests
        run: |
          uv run python -m pytest test/ -q \
            --ignore-glob='test/test_v1_*.py' \
            --ignore=test/test_account_image_capabilities.py

      # RBAC của zalo-server là code Node, pytest không chạm tới. Test dùng
      # runner có sẵn của Node (`node --test`), không thêm dependency nào.
      - name: Zalo-server RBAC tests
        working-directory: zalo-server
        run: node --test test/rbac.test.js

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # CỔNG CHẶN CỨNG từ 08/08/2026: 26 lỗi type sẵn có đã dọn hết và
      # `ignoreBuildErrors` đã gỡ khỏi next.config.ts, nên `next build` trong
      # Docker cũng tự fail khi có lỗi type. Bước này chỉ để phát hiện SỚM
      # (30 giây) thay vì chờ hết một lượt build image ~30 phút.
      #
      # npm ci (không phải bun) từ 08/08/2026: image cũng build bằng npm ci nên
      # cổng này và image nói về CÙNG một cây phụ thuộc. Trước đây image dùng
      # bun.lock còn audit đọc package-lock.json — audit mô tả thứ không chạy.
      - name: Web typecheck (gate)
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit

      # Chỉ CRITICAL mới chặn. `--omit=dev` là chủ ý: web xuất bản TĨNH
      # (next.config `output: 'export'`), nên devDependencies không đi vào
      # image và không phục vụ request nào — để chúng chặn merge là biến cổng
      # này thành thứ người ta quen bỏ qua.
      - name: Web audit (critical chặn)
        working-directory: web
        run: npm audit --omit=dev --audit-level=critical

      # Báo cáo mức high, KHÔNG chặn — để thấy mà xử lý có kế hoạch.
      - name: Web audit (high — chỉ báo cáo)
        working-directory: web
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Zalo-server audit (critical chặn)
        working-directory: zalo-server
        run: npm audit --omit=dev --audit-level=critical

  # Build each architecture on its NATIVE runner (fast; no QEMU emulation of the
  # ~9GB browser+ML image). arm64 uses GitHub's free hosted arm64 runner
  # (public repos). Each leg pushes a digest-only image; `merge` stitches them
  # into one multi-arch manifest. Google Chrome is amd64-only, so the Dockerfile
  # installs Debian chromium on arm64 (TARGETARCH branch).
  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: app
          platforms: ${{ matrix.platform }}
          # gha cache previously served a stale services/ layer; keep off so the
          # image always contains the committed code (~1m slower).
          no-cache: true
          # GH runner ở Mỹ: mirror aliyun (default trong pyproject) hay timeout
          # (vnstock, posthog) — ép PyPI chính hãng như job test.
          build-args: |
            UV_DEFAULT_INDEX=https://pypi.org/simple
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Image GPU (amd64-only, tag :gpu): thêm torch CUDA + transformers để VieNeu
  # tự chạy PyTorch/GPU (vieneu_backend=auto). Tách tag riêng — image thường
  # giữ nguyên nhẹ. Image ~15GB nên phải dọn đĩa runner trước khi build.
  build-gpu:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push :gpu
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: app
          platforms: linux/amd64
          no-cache: true
          build-args: |
            GPU=1
            UV_DEFAULT_INDEX=https://pypi.org/simple
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:gpu

  # Stitch the per-arch digests into a single multi-arch manifest with the real
  # tags (latest / sha- / version). Only runs if BOTH arch builds succeed, so a
  # broken arm64 leg never overwrites the working amd64 `latest`.
  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect published manifest
        run: docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
