# Security gate — chạy TRƯỚC build. Chặn secret lộ + SAST high + audit dependency.
# Chuẩn ngành 2025 (OWASP): gitleaks (secret), bandit (SAST high), pip/npm audit (SCA).
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 1"   # quét sâu định kỳ (thứ Hai 02:00 UTC)

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # P1#10: pin major action tags; bump intentionally (digest-pin when org policy requires)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # gitleaks quét cả lịch sử
      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bandit HIGH (hard-fail)
        run: |
          pip install bandit
          # -lll = HIGH only (critical operational findings). Medium vẫn xem ở bước dưới.
          bandit -r services api utils -lll -x test
      - name: Bandit medium report (soft)
        run: |
          bandit -r services api utils -ll -x test || true
      - name: Semgrep (OWASP rules, soft until baseline clean)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/owasp-top-ten
        continue-on-error: true

  deps-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: pip-audit (Python SCA — fail on known vulns)
        run: |
          # Export deps KHÔNG hash. pip-audit không hash được VCS (git+) dep
          # (vd gemini-webapi từ GitHub) → nội bộ pip lỗi "can't verify hashes
          # for VCS repos". Bỏ --hash + lọc dòng git → audit các gói PyPI còn
          # lại (VCS dep build trong Docker, ngoài phạm vi CVE của pip-audit).
          uv export --format requirements-txt --no-dev --no-hashes -o /tmp/reqs.raw.txt 2>/dev/null \
            || uv export --format requirements-txt --no-hashes -o /tmp/reqs.raw.txt
          grep -vE '(git\+|@ git|^-e )' /tmp/reqs.raw.txt > /tmp/reqs.txt || true
          if [ -s /tmp/reqs.txt ]; then
            uvx pip-audit -r /tmp/reqs.txt --no-deps --progress-spinner off \
              || { echo "::error::pip-audit found vulnerabilities — fix or pin with justification"; exit 1; }
          else
            echo "No requirements export; skip hard fail"
          fi
      - name: npm audit high/critical (web SCA)
        working-directory: web
        run: |
          # --audit-level=high: chỉ fail high/critical (bỏ qua dev + optional deps như sharp của Next.js)
          npm audit --omit=dev --omit=optional --audit-level=high \
            || { echo "::error::npm audit high/critical findings"; exit 1; }

      # zalo-server là code CHẠY THẬT trong image (Dockerfile: npm ci --omit=dev)
      # nhưng trước nay không hề được audit — CVE của express/ws/axios/sharp đi
      # thẳng vào production mà không ai thấy.
      #
      # Vì sao gate ở `critical` chứ không phải `high`: đo ngày 08/08 còn 2 lỗ
      # HIGH không vá được mà không phá vỡ tương thích — `sharp <0.35.0` (phải
      # nhảy 0.35.3, breaking) và `image-size` (chưa có bản vá). Đặt gate ở
      # `high` là CI đỏ vĩnh viễn cho tới khi có nhánh nâng dependency, mà cổng
      # đỏ mãi thì người ta bỏ qua nó — tệ hơn không có cổng.
      #
      # 9 lỗ HIGH khác (ws, axios, express, body-parser…) vá được bằng
      # `npm audit fix` KHÔNG --force; việc đó chạm 27 gói gồm cả tầng
      # express-session, nên phải làm ở nhánh riêng có test đăng nhập thật.
      - name: npm audit (zalo-server SCA — báo cáo)
        working-directory: zalo-server
        continue-on-error: true
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: npm audit critical (zalo-server SCA — cổng chặn)
        working-directory: zalo-server
        run: |
          npm audit --omit=dev --omit=optional --audit-level=critical \
            || { echo "::error::zalo-server có lỗ hổng CRITICAL"; exit 1; }

