# ============================================================================
# All-in-one stack in ONE container (c2a):
#   API gateway + Web UI + VN MCP Hub + Captcha Solver
#   + noVNC browser stack + Zalo server + Wyoming
#
#   docker compose up -d            # dùng image sẵn (không build)
#   docker compose up -d --build    # chỉ khi cần build lại
#
# Cổng (homelab / multi-host — mặc định publish LAN):
#   3030   API + Web UI
#   6080   noVNC (đăng nhập web thủ công) — BẮT BUỘC đặt VNC_PASSWORD
#   3001   zalo-server (HA / integration có thể ở máy khác)
#   10600  Wyoming multi — TTS+STT vi/en (1 integration HA, pattern microsoft-stt/tts)
#          (Home Assistant thường KHÔNG cùng host → không bind 127.0.0.1)
#
# Siết chặt hơn (cùng host hoặc SSH tunnel):
#   - "127.0.0.1:6080:6080"
#   - "127.0.0.1:3001:3001"
#   - "127.0.0.1:10600:10600"
# Chỉ làm vậy khi client thật sự chạy trên cùng máy host Docker.
#
# Sidecar (không gộp vào service c2a):
#   OfficeCLI  — binary trong image + MCP preset "officecli" (hub /officecli/mcp)
#   DeepTutor  — docker compose -f deploy/deeptutor/docker-compose.yml up -d
#   Chi tiết: docs/INTEGRATIONS_OFFICECLI_DEEPTUTOR.md
# ============================================================================

services:
  c2a:
    build:
      context: .
      dockerfile: Dockerfile
    image: c2a:latest
    container_name: c2a
    restart: unless-stopped

    # Trần file descriptor. Mặc định của Docker là 1024 — ĐO THẬT ngày
    # 2026-07-27: tiến trình uvicorn giữ 1021 fd (510 socket + 497 eventfd,
    # dấu vân tay của handle libcurl/curl_cffi chưa đóng) tức dính sát trần.
    # Hậu quả không chỉ là "Too many open files": hết fd thì curl không mở nổi
    # socket phân giải tên, báo thành "Could not resolve host" / "getaddrinfo()
    # thread failed to start" → OCR vision, Gemini và mọi tìm kiếm cùng chết
    # trong khi DNS của máy vẫn tốt. Hard limit sẵn có là 524288 nên nâng soft
    # limit không tốn gì.
    # LƯU Ý: đây là thuốc giảm đau, KHÔNG phải thuốc chữa — chỗ rò handle vẫn
    # còn, chỉ là lâu hơn mới chạm trần.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    ports:
      - "3030:80"        # API + web UI (+ same-origin /api/captcha proxy)
      - "6080:6080"      # noVNC — LAN OK nếu có VNC_PASSWORD; đừng mở WAN
      - "3001:3001"      # zalo-server — cho HA/integration trên LAN
      - "10600:10600"    # Wyoming multi — TTS+STT vi/en (1 port, VieNeu/Kokoro + Zipformer/Parakeet)
      - "10700:10700"    # WhisperLive WebSocket — Real-time Streaming STT (Faster-Whisper CTranslate2)

    volumes:
      # Single persistent mount: accounts, config, KB/chroma, captcha profiles, voices
      - /opt/c2a-data:/app/data
      # Giờ Việt Nam bên trong container. Chỉ đặt TZ= là chưa chắc đủ nếu image
      # thiếu tzdata, nên mount thẳng file múi giờ của host (host đã đặt
      # Asia/Ho_Chi_Minh). Ảnh hưởng trực tiếp mọi thứ hẹn giờ: nhắc nhở,
      # thông báo, announce, mốc thời gian trong log.
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # [REQUIRED] Auth key protecting the API + dashboard login
      CHATGPT2API_AUTH_KEY: your_secret_key_here
      # captcha-solver internal auth (claude/gemini/flow web logins)
      CAPTCHA_SOLVER_API_KEY: your_secret_key_here
      # zalo-server :3001 — cùng key (Bearer) cho HA/API gửi tin (P0#4)
      ZALO_SERVER_API_KEY: ${ZALO_SERVER_API_KEY:-your_secret_key_here}
      STORAGE_BACKEND: json
      # [Optional] Public base URL for image links
      # CHATGPT2API_BASE_URL: https://your-domain.com
      # [REQUIRED khi dùng noVNC] — không đặt = không mật khẩu (nguy hiểm trên LAN)
      VNC_PASSWORD: ${VNC_PASSWORD:-changeme-set-vnc-password}
      # URL noVNC mà UI captcha mở trên máy khác trong LAN (đổi IP host của bạn)
      # CAPTCHA_SOLVER_NOVNC_EXTERNAL_URL: "http://172.16.10.38:6080/vnc.html?host=172.16.10.38&port=6080&autoconnect=1"

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/version')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Postgres MCP Pro (tuỳ chọn) ────────────────────────────────────────────
  # Cho agent hỏi thẳng Postgres: EXPLAIN, gợi ý index, health check (cache
  # hit, index trùng, vacuum, replication lag).
  #
  # CHỈ ĐỌC: --access-mode=restricted khoá mọi thao tác ghi, nên model có gọi
  # nhầm cũng không sửa/xoá được dữ liệu. Đừng đổi sang unrestricted trên máy
  # chạy thật.
  #
  # Dùng SSE vì MCP client của gateway gọi qua HTTP (Accept: text/event-stream),
  # không nói chuyện được với MCP kiểu stdio.
  #
  # Chỉ chạy khi STORAGE_BACKEND=postgres. Bật rồi thì thêm MCP server trong
  # Cài đặt với URL:  http://postgres-mcp:8000/sse
  # (không cần publish cổng ra host — c2a gọi nội bộ theo tên service)
  #
  # ⚠️ MẠNG — chỗ này đã làm hỏng một lần, đọc kỹ:
  # Khai chung file này thì c2a và postgres-mcp cùng một compose project nên
  # Docker tự cho chung mạng, gọi theo tên service là tới. KHÔNG cần khai
  # networks.
  #
  # NHƯNG nếu bạn tách postgres-mcp sang stack khác (vd để chung với stack
  # 'db' trong Portainer) thì hai container ở HAI MẠNG KHÁC NHAU — đo thật
  # 2026-07-28: c2a ở c2a_default (172.19.0.2), postgres-mcp ở c2a-db_default
  # (172.20.0.2), gọi http://postgres-mcp:8000/sse trả về 000. Lúc đó phải
  # cho nó vào cả mạng của c2a:
  #
  #   postgres-mcp:
  #     ...
  #     networks:
  #       - default
  #       - c2a_net
  #
  #   networks:            # ngoài cùng, ngang hàng với services
  #     c2a_net:
  #       external: true
  #       name: c2a_default
  #
  # Khai kiểu này mới bền — dựng lại stack vẫn giữ. Đừng dùng
  # `docker network connect` bằng tay: mất sạch sau lần deploy kế tiếp.
  postgres-mcp:
    image: crystaldba/postgres-mcp:latest
    container_name: postgres-mcp
    restart: unless-stopped
    profiles: ["postgres"]

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      DATABASE_URI: ${DATABASE_URL:-postgresql://c2a_user:${DB_PASSWORD:-changeme}@host.docker.internal:5432/c2a_db}

    command: ["--access-mode=restricted", "--transport=sse"]

    security_opt:
      - no-new-privileges:true

  # ── SearXNG: đường tìm kiếm thứ N, không cần bật gì ──────────────────────
  #
  # Vì sao đưa vào stack thay vì để người dùng tự dựng: gateway đã có sẵn lớp
  # `SearXNGSearcher` từ trước nhưng mặc định trỏ `localhost:8080` — không có gì
  # ở đó, nên đường tìm kiếm này chưa bao giờ chạy. Có service ở đây thì
  # gateway tự phát hiện qua /healthz và tự dùng, không ai phải bấm bật.
  #
  # KHÔNG publish cổng: chỉ container trong cùng compose network gọi được. Mở ra
  # ngoài là biến nó thành instance công khai — lúc đó phải bật limiter, mà bật
  # limiter thì chính gateway bị chặn (4 request/IP/giờ cho format=json).
  #
  # KHÔNG cần Valkey/Redis: chỉ limiter mới cần, và ta tắt limiter.
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped

    environment:
      # BẮT BUỘC: mount settings.yml của mình thì entrypoint không tự sinh khoá,
      # và webapp gọi sys.exit(1) nếu secret_key vẫn là "ultrasecretkey".
      SEARXNG_SECRET: "${SEARXNG_SECRET:?dat SEARXNG_SECRET trong .env - sinh bang: openssl rand -hex 32}"
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_LIMITER: "false"

    volumes:
      # settings.yml BẮT BUỘC vì `search.formats` không có biến môi trường —
      # thiếu file này thì mọi ?format=json trả 403.
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/var/cache/searxng

    healthcheck:
      # /healthz được limiter miễn trừ nên luôn trả lời được.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true

  # ── xiaozhi-server: loa Phicomm R1 / AI Box nói chuyện với c2a ─────────────
  # Loa (chuẩn xiaozhi) nói "Alexa" → stream audio tới đây → c2a lo LLM+STT+TTS.
  # KHÔNG phụ thuộc bên thứ 3: STT/TTS/LLM đều gọi c2a nội bộ (http://c2a:80).
  # KHÔNG cần build lại image nào — xiaozhi-server là image công khai dựng sẵn.
  #
  # "Dùng ngay": chỉ cần trong .env có CHATGPT2API_AUTH_KEY và SERVER_IP
  # (= IP LAN của host, loa quay số tới). Config .config.yaml TỰ SINH lúc khởi
  # động (service xiaozhi-config), không phải sửa tay.
  #
  # Việc còn lại theo bản chất KHÔNG nhét vào image được:
  #   1) tải model giọng 1 lần (xem xiaozhi-server/README-loa-R1.md)
  #   2) trỏ OTA của loa → http://<SERVER_IP>:8003/xiaozhi/ota/

  xiaozhi-config:
    # Sinh /data/.config.yaml từ mẫu + env, ghi vào volume dùng chung, rồi thoát.
    image: busybox:1.36
    environment:
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:?dat trong .env}
      SERVER_IP: ${SERVER_IP:?dat SERVER_IP=IP_LAN_cua_host trong .env}
    volumes:
      - ./xiaozhi-server:/tpl:ro
      - xiaozhi-data:/out
    command: ["sh", "/tpl/render-config.sh"]

  xiaozhi-server:
    image: ghcr.io/xinnan-tech/xiaozhi-esp32-server:server_latest
    container_name: xiaozhi-esp32-server
    restart: unless-stopped
    depends_on:
      xiaozhi-config:
        condition: service_completed_successfully
    ports:
      - "8000:8000"     # WebSocket audio — loa nối vào
      - "8003:8003"     # OTA — loa trỏ tới http://<SERVER_IP>:8003/xiaozhi/ota/
    volumes:
      - xiaozhi-data:/opt/xiaozhi-esp32-server/data
    security_opt:
      - no-new-privileges:true

volumes:
  searxng-data:
  xiaozhi-data:
