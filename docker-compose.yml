# ============================================================================
# All-in-one stack in ONE container (c2a):
#   API gateway + Web UI + VN MCP Hub + Captcha Solver
#   + noVNC browser stack + Zalo server + Wyoming
#
#   docker compose up -d            # dùng image sẵn (không build)
#   docker compose up -d --build    # chỉ khi cần build lại
#
# Cổng (homelab / multi-host — mặc định publish LAN):
#   3030   API + Web UI
#   6080   noVNC (đăng nhập web thủ công) — BẮT BUỘC đặt VNC_PASSWORD
#   3001   zalo-server (HA / integration có thể ở máy khác)
#   10600  Wyoming multi — TTS+STT vi/en (1 integration HA, pattern microsoft-stt/tts)
#          (Home Assistant thường KHÔNG cùng host → không bind 127.0.0.1)
#
# Siết chặt hơn (cùng host hoặc SSH tunnel):
#   - "127.0.0.1:6080:6080"
#   - "127.0.0.1:3001:3001"
#   - "127.0.0.1:10600:10600"
# Chỉ làm vậy khi client thật sự chạy trên cùng máy host Docker.
#
# Sidecar (không gộp vào service c2a):
#   OfficeCLI  — binary trong image + MCP preset "officecli" (hub /officecli/mcp)
#   DeepTutor  — docker compose -f deploy/deeptutor/docker-compose.yml up -d
#   Chi tiết: docs/INTEGRATIONS_OFFICECLI_DEEPTUTOR.md
# ============================================================================

services:
  c2a:
    build:
      context: .
      dockerfile: Dockerfile
    image: c2a:latest
    container_name: c2a
    restart: unless-stopped

    # Trần file descriptor. Mặc định của Docker là 1024 — ĐO THẬT ngày
    # 2026-07-27: tiến trình uvicorn giữ 1021 fd (510 socket + 497 eventfd,
    # dấu vân tay của handle libcurl/curl_cffi chưa đóng) tức dính sát trần.
    # Hậu quả không chỉ là "Too many open files": hết fd thì curl không mở nổi
    # socket phân giải tên, báo thành "Could not resolve host" / "getaddrinfo()
    # thread failed to start" → OCR vision, Gemini và mọi tìm kiếm cùng chết
    # trong khi DNS của máy vẫn tốt. Hard limit sẵn có là 524288 nên nâng soft
    # limit không tốn gì.
    # LƯU Ý: đây là thuốc giảm đau, KHÔNG phải thuốc chữa — chỗ rò handle vẫn
    # còn, chỉ là lâu hơn mới chạm trần.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    ports:
      - "3030:80"        # API + web UI (+ same-origin /api/captcha proxy)
      - "6080:6080"      # noVNC — LAN OK nếu có VNC_PASSWORD; đừng mở WAN
      - "3001:3001"      # zalo-server — cho HA/integration trên LAN
      - "10600:10600"    # Wyoming multi — TTS+STT vi/en (1 port, VieNeu/Kokoro + Zipformer/Parakeet)
      - "10700:10700"    # WhisperLive WebSocket — Real-time Streaming STT (Faster-Whisper CTranslate2)

    volumes:
      # Single persistent mount: accounts, config, KB/chroma, captcha profiles, voices
      - /opt/c2a-data:/app/data
      # Giờ Việt Nam bên trong container. Chỉ đặt TZ= là chưa chắc đủ nếu image
      # thiếu tzdata, nên mount thẳng file múi giờ của host (host đã đặt
      # Asia/Ho_Chi_Minh). Ảnh hưởng trực tiếp mọi thứ hẹn giờ: nhắc nhở,
      # thông báo, announce, mốc thời gian trong log.
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # [REQUIRED] Auth key protecting the API + dashboard login. FAIL-FAST:
      # không đặt biến môi trường là deploy DỪNG NGAY, không chạy bằng secret
      # mặc định đoán được (báo cáo bảo mật 07/08). Đặt trong Portainer →
      # Environment, hoặc file .env cạnh compose.
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:?CHATGPT2API_AUTH_KEY chưa đặt — hãy khai một khoá mạnh}
      # captcha-solver internal auth (claude/gemini/flow web logins)
      CAPTCHA_SOLVER_API_KEY: ${CAPTCHA_SOLVER_API_KEY:?CAPTCHA_SOLVER_API_KEY chưa đặt}
      # Máy dịch tự dựng trong stack (service `libretranslate` bên dưới). Khai ở
      # ĐÂY chứ không bắt admin sửa config.json: dựng compose là dịch chạy —
      # lệnh /dich của bot + mục 🌐 khi gửi tệp/ảnh. Xoá biến này = tắt hẳn.
      TRANSLATE_URL: ${TRANSLATE_URL:-http://libretranslate:5000}
      # Dịch sang tiếng Anh trước khi gửi LLM rồi dịch phản hồi về tiếng Việt.
      # MẶC ĐỊNH TẮT — đổi hành vi của MỌI lượt gọi model, phải tự bật.
      # Xem docs/DICH_LIBRETRANSLATE.md mục 5 trước khi đặt "1".
      TRANSLATE_PIVOT: ${TRANSLATE_PIVOT:-0}
      # zalo-server :3001 — cùng key (Bearer) cho HA/API gửi tin (P0#4)
      ZALO_SERVER_API_KEY: ${ZALO_SERVER_API_KEY:?ZALO_SERVER_API_KEY chưa đặt}
      # [KHUYẾN NGHỊ] Bí mật ký session zalo-server. Không đặt thì app tự sinh
      # NGẪU NHIÊN mỗi lần chạy (an toàn, nhưng session mất sau mỗi restart —
      # phải đăng nhập lại). Đặt một chuỗi ngẫu nhiên cố định để session bền.
      # CỐ Ý không bắt buộc: thiếu nó không tạo lỗ hổng, chặn deploy là vô ích.
      SESSION_SECRET: ${SESSION_SECRET:-}
      # [KHUYẾN NGHỊ] Mật khẩu admin zalo-server. CHỈ dùng khi users.json chưa
      # tồn tại (seed lần đầu); đã có file thì không ảnh hưởng. Bot Python đọc
      # CÙNG biến này để đăng nhập, nên nếu seed mới thì phải đặt, kẻo mật khẩu
      # sinh ngẫu nhiên và bot không đăng nhập được.
      ZALO_SERVER_ADMIN_PASSWORD: ${ZALO_SERVER_ADMIN_PASSWORD:-}
      ZALO_SERVER_ADMIN_USERNAME: ${ZALO_SERVER_ADMIN_USERNAME:-admin}
      # Cookie session Secure: đặt =1 khi chạy chỉ-HTTPS (tunnel). Mặc định 0 để
      # không phá đăng nhập LAN qua HTTP.
      ZALO_COOKIE_SECURE: ${ZALO_COOKIE_SECURE:-0}
      # Origin được phép mở WebSocket của zalo-server (phẩy ngăn cách). ĐỂ TRỐNG
      # là dùng luật same-host — đúng cho triển khai LAN/Portainer. Chỉ khai khi
      # zalo-server đứng sau một domain cố định, và khai ĐÚNG origin của CHÍNH
      # zalo-server (khai domain của app chính sẽ chặn nhầm trang chat).
      # supervisord KHÔNG cần liệt kê lại: tiến trình con thừa hưởng env container.
      ZALO_WS_ALLOWED_ORIGINS: ${ZALO_WS_ALLOWED_ORIGINS:-}
      STORAGE_BACKEND: json
      # [Optional] Public base URL for image links
      # CHATGPT2API_BASE_URL: https://your-domain.com
      # [REQUIRED] noVNC (:6080) được publish ra LAN — FAIL-FAST nếu chưa đặt
      # mật khẩu, không chạy bằng 'changeme' mặc định. Không dùng noVNC thì đặt
      # một chuỗi ngẫu nhiên bất kỳ (cổng vẫn nên tường lửa khỏi WAN).
      VNC_PASSWORD: ${VNC_PASSWORD:?VNC_PASSWORD chưa đặt — noVNC publish ra LAN cần mật khẩu}
      # URL noVNC mà UI captcha mở trên máy khác trong LAN (đổi IP host của bạn)
      # CAPTCHA_SOLVER_NOVNC_EXTERNAL_URL: "http://172.16.10.38:6080/vnc.html?host=172.16.10.38&port=6080&autoconnect=1"
      #
      # [Khuyến nghị] Khoá mã hoá mật khẩu Google + hạt giống TOTP trong
      # /data/accounts.db (AES-256-GCM). base64 của 32 byte ngẫu nhiên:
      #     python3 -c "import base64,os;print(base64.b64encode(os.urandom(32)).decode())"
      #
      # CỐ Ý KHÔNG bắt buộc: thiếu nó thì vẫn ghi chữ thường như cũ và chỉ có
      # log cảnh báo. Bắt buộc sẽ làm container không lên được sau khi cập
      # nhật — mất cả hệ thống tệ hơn nhiều so với thứ nó định bảo vệ.
      #
      # ĐẶT RỒI THÌ ĐỪNG ĐỔI: đổi khoá là không đọc được các bản ghi đã mã hoá
      # (chúng trả rỗng, đăng nhập tự động sẽ hỏng). Mất khoá thì phải nhập lại
      # mật khẩu và TOTP cho từng tài khoản. Sao lưu khoá cùng chỗ với các bí
      # mật khác, KHÔNG để cạnh accounts.db.
      # Để trống = không mã hoá (có log cảnh báo) — xem services/vault.py.
      # PHẢI là ánh xạ thật, không phải comment: để dạng comment thì giá trị
      # trong .env không bao giờ tới được container, và người đặt biến sẽ tưởng
      # đã bật mã hoá trong khi vẫn ghi chữ thường.
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:-}
      #
      # Đặt "1" để TỪ CHỐI ghi credential dạng chữ thường khi thiếu khoá, thay
      # vì âm thầm ghi rồi chỉ để lại một dòng log. Không có nó thì chỉ cần gõ
      # sai định dạng khoá một lần (phải là base64 của ĐÚNG 32 byte) là mọi mật
      # khẩu và hạt giống TOTP quay về plaintext mà không ai biết.
      VAULT_REQUIRE_ENCRYPTION: ${VAULT_REQUIRE_ENCRYPTION:-}
      #
      # [Tuỳ chọn] Chạy bốn dịch vụ ứng dụng dưới người dùng không đặc quyền.
      # Mặc định `root` = hành vi hiện tại. Muốn đổi thì phải làm CẢ HAI:
      #
      #   APP_USER: c2a
      #   APP_PORT: 8080          # cổng 80 là đặc quyền, non-root không bind được
      #   ports:  - "3030:8080"   # và sửa ánh xạ cho khớp
      #
      # supervisord tự `chown -R` /app/data trước khi khởi động, nên không phải
      # chown thủ công trên host. Bộ X (noVNC) vẫn chạy root — đây là bước tách
      # quyền cho phần phục vụ request, chưa phải non-root hoàn toàn.
      APP_USER: ${APP_USER:-root}
      APP_PORT: ${APP_PORT:-80}

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/version')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Postgres MCP Pro (tuỳ chọn) ────────────────────────────────────────────
  # Cho agent hỏi thẳng Postgres: EXPLAIN, gợi ý index, health check (cache
  # hit, index trùng, vacuum, replication lag).
  #
  # CHỈ ĐỌC: --access-mode=restricted khoá mọi thao tác ghi, nên model có gọi
  # nhầm cũng không sửa/xoá được dữ liệu. Đừng đổi sang unrestricted trên máy
  # chạy thật.
  #
  # Dùng SSE vì MCP client của gateway gọi qua HTTP (Accept: text/event-stream),
  # không nói chuyện được với MCP kiểu stdio.
  #
  # Chỉ chạy khi STORAGE_BACKEND=postgres. Bật rồi thì thêm MCP server trong
  # Cài đặt với URL:  http://postgres-mcp:8000/sse
  # (không cần publish cổng ra host — c2a gọi nội bộ theo tên service)
  #
  # ⚠️ MẠNG — chỗ này đã làm hỏng một lần, đọc kỹ:
  # Khai chung file này thì c2a và postgres-mcp cùng một compose project nên
  # Docker tự cho chung mạng, gọi theo tên service là tới. KHÔNG cần khai
  # networks.
  #
  # NHƯNG nếu bạn tách postgres-mcp sang stack khác (vd để chung với stack
  # 'db' trong Portainer) thì hai container ở HAI MẠNG KHÁC NHAU — đo thật
  # 2026-07-28: c2a ở c2a_default (172.19.0.2), postgres-mcp ở c2a-db_default
  # (172.20.0.2), gọi http://postgres-mcp:8000/sse trả về 000. Lúc đó phải
  # cho nó vào cả mạng của c2a:
  #
  #   postgres-mcp:
  #     ...
  #     networks:
  #       - default
  #       - c2a_net
  #
  #   networks:            # ngoài cùng, ngang hàng với services
  #     c2a_net:
  #       external: true
  #       name: c2a_default
  #
  # Khai kiểu này mới bền — dựng lại stack vẫn giữ. Đừng dùng
  # `docker network connect` bằng tay: mất sạch sau lần deploy kế tiếp.
  postgres-mcp:
    image: crystaldba/postgres-mcp:latest
    container_name: postgres-mcp
    restart: unless-stopped
    profiles: ["postgres"]

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      DATABASE_URI: ${DATABASE_URL:-postgresql://c2a_user:${DB_PASSWORD:-changeme}@host.docker.internal:5432/c2a_db}

    command: ["--access-mode=restricted", "--transport=sse"]

    security_opt:
      - no-new-privileges:true

  # ── SearXNG: đường tìm kiếm thứ N, không cần bật gì ──────────────────────
  #
  # Vì sao đưa vào stack thay vì để người dùng tự dựng: gateway đã có sẵn lớp
  # `SearXNGSearcher` từ trước nhưng mặc định trỏ `localhost:8080` — không có gì
  # ở đó, nên đường tìm kiếm này chưa bao giờ chạy. Có service ở đây thì
  # gateway tự phát hiện qua /healthz và tự dùng, không ai phải bấm bật.
  #
  # KHÔNG publish cổng: chỉ container trong cùng compose network gọi được. Mở ra
  # ngoài là biến nó thành instance công khai — lúc đó phải bật limiter, mà bật
  # limiter thì chính gateway bị chặn (4 request/IP/giờ cho format=json).
  #
  # KHÔNG cần Valkey/Redis: chỉ limiter mới cần, và ta tắt limiter.
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped

    environment:
      # BẮT BUỘC: mount settings.yml của mình thì entrypoint không tự sinh khoá,
      # và webapp gọi sys.exit(1) nếu secret_key vẫn là "ultrasecretkey".
      SEARXNG_SECRET: "${SEARXNG_SECRET:?dat SEARXNG_SECRET trong .env - sinh bang: openssl rand -hex 32}"
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_LIMITER: "false"

    volumes:
      # settings.yml BẮT BUỘC vì `search.formats` không có biến môi trường —
      # thiếu file này thì mọi ?format=json trả 403.
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/var/cache/searxng

    healthcheck:
      # /healthz được limiter miễn trừ nên luôn trả lời được.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true

  # ── LibreTranslate: máy dịch TỰ CHỦ, không qua bên thứ ba ────────────────
  #
  # Cùng nếp SearXNG ở trên: nằm trong stack, không publish cổng, và gateway tự
  # dùng nhờ biến TRANSLATE_URL đã khai ở service c2a — không ai phải bấm bật.
  # Nhân dịch là Argos Translate chạy hẳn trong container; sau khi tải model
  # xong thì không lượt dịch nào ra Internet.
  #
  # LẦN ĐẦU `up` SẼ TẢI 756 MB MODEL (đo thật 12/08) và mất vài phút mới dịch
  # được. /health trả 200 ngay nhưng /translate còn báo lỗi trong lúc đó. Model
  # nằm ở /opt/libretranslate-models nên các lần sau KHÔNG tải lại.
  #
  # CỐ Ý KHÔNG `depends_on: condition: service_healthy` từ c2a: c2a không được
  # chờ 756 MB tải xong mới lên. Trục dịch fail-open — máy dịch chưa sẵn sàng
  # thì bot vẫn chạy y như chưa có tính năng này.
  #
  # ĐO THẬT 12/08 — vì sao có `libretranslate-init`: Dockerfile của
  # LibreTranslate tạo user `libretranslate` uid/gid 1032 rồi `USER
  # libretranslate`, nhưng thư mục mount vào thì thuộc **root** (Docker tạo mới
  # thư mục host của bind mount bằng root, và KHÔNG copy quyền từ image vào bind
  # mount bao giờ). Tiến trình uid 1032 không tạo nổi `.local/share` → chết ngay
  # ở `import argostranslate` với PermissionError, kèm dòng gây nhiễu
  # "'' is not a valid port number" vì entrypoint.sh gọi print_args_env.py cũng
  # chết theo nên PORT thành rỗng.
  #
  # Init container đổi chủ thư mục trước, chạy một lần rồi thoát — nhờ vậy tiến
  # trình chính vẫn KHÔNG phải root, và không ai phải gõ chown bằng tay trên host.
  libretranslate-init:
    image: busybox:stable
    container_name: libretranslate-init
    user: root
    command: ["sh", "-c", "mkdir -p /data/share /data/cache && chown -R 1032:1032 /data"]
    volumes:
      - /opt/libretranslate-models:/data
    restart: "no"

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate
    restart: unless-stopped

    depends_on:
      libretranslate-init:
        condition: service_completed_successfully

    environment:
      # Đúng bốn cặp đang dùng: Anh⇄Việt, Việt⇄Nhật, Việt⇄Hàn, Việt⇄Trung.
      #
      # "en" PHẢI có mặt dù không ai xin cặp Anh–Nhật: 98/100 gói model của
      # Argos có tiếng Anh ở một đầu (cặp trực tiếp duy nhất không qua tiếng Anh
      # là pt↔es), tức KHÔNG TỒN TẠI model vi↔ja. Argos dựng đường bắc cầu
      # vi→en→ja lúc nạp. Bỏ "en" ra là ba cặp Nhật/Hàn/Trung chết theo.
      #
      # Lọc theo CẢ HAI ĐẦU (init.py: from_code và to_code đều phải trong danh
      # sách) → 8 gói, 756 MB: en→ja 120,5 · ja→en 117,2 · en→ko 120,8 ·
      # ko→en 118,9 · en→zh 70,7 · zh→en 74,5 · en→vi 67,8 · vi→en 65,9.
      #
      # Chỉ cần Anh⇄Việt thì đặt LT_LOAD_ONLY=en,vi trong .env → 134 MB.
      # "zh" là chữ Hán GIẢN THỂ (khai ra ngoài là "zh-Hans"); thêm "zt" nếu
      # cần phồn thể. Bỏ hẳn biến này = nạp cả 50 ngôn ngữ, vài GB.
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-en,vi,ja,ko,zh}
      LT_UPDATE_MODELS: "true"
      # Chỉ c2a gọi vào qua mạng nội bộ của compose → không cần khoá API, không
      # cần giới hạn tần suất. Bật LT_API_KEYS chỉ khi có ý định mở ra ngoài.
      LT_API_KEYS: "false"
      # Đệm bản dịch phía MÁY CHỦ (gateway có bộ đệm riêng). Tài liệu và lịch sử
      # hội thoại lặp lại nhiều nên đáng bật.
      LT_TRANSLATION_CACHE: "memory://"
      LT_THREADS: "4"

    volumes:
      # Thiếu dòng này là mỗi lần dựng lại container phải tải lại 756 MB.
      # Bind mount (không phải named volume) để xem/dọn model thẳng trên host.
      - /opt/libretranslate-models:/home/libretranslate/.local:rw

    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 30s
      timeout: 5s
      # start_period dài vì lần đầu nó tải 756 MB model mới mở cổng 5000. Để 20s
      # như các service khác thì container bị đánh dấu unhealthy suốt lúc tải —
      # báo động giả, và ai nhìn Portainer cũng tưởng nó hỏng.
      start_period: 900s
      retries: 3

    security_opt:
      - no-new-privileges:true

volumes:
  searxng-data:
