# =====================================================================
# STACK MODULE ĐẦY ĐỦ (智控台) — c2a + xiaozhi full: server + web console
# + MySQL + Redis. Dán TOÀN BỘ vào Portainer → Stacks → Editor.
#
# Khác bản nhẹ: LLM/model, giọng (TTS), STT, persona, SERVER_IP... KHÔNG nằm
# trong file này nữa — cấu hình HẾT trong CONSOLE web tại http://<host>:8002.
# File này chỉ trỏ xiaozhi-server về manager-api + secret.
#
# ⚠️ CHƯA test build được ở đây — dựng bám sát docker-compose_all.yml chính chủ.
#
# Environment của stack cần:
#   - AUTH_KEY        : (cho c2a, đã có)
#   - DB_PASSWORD, VNC_PASSWORD : (cho c2a, đã có)
#   - XZ_DB_PASSWORD  : (tuỳ chọn) mật khẩu MySQL nội bộ của xiaozhi; mặc định 123456.
#   - XZ_MANAGER_SECRET : LẤY SAU bước 1 (xem QUY TRÌNH LẦN ĐẦU cuối file). Deploy
#                         lần đầu để trống, sau đó điền rồi Update lại.
#
# MySQL/Redis KHÔNG dùng chung với c2a được (c2a là PostgreSQL; console xiaozhi
# bắt buộc MySQL). Data để chung thư mục /opt/c2a/data/xiaozhi cho gọn backup.
# =====================================================================

services:
  c2a:
    image: ghcr.io/tritue2011/chatgpt2api:latest
    container_name: c2a
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3030:80"
      - "6080:6080"
      - "3001:3001"
      - "10600:10600"
      - "10700:10700"
    volumes:
      - /opt/c2a/data:/app/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - STORAGE_BACKEND=postgres
      - DATABASE_URL=postgresql://c2a_user:${DB_PASSWORD}@host.docker.internal:5432/c2a_db
      - CHATGPT2API_AUTH_KEY=${AUTH_KEY}
      - CAPTCHA_SOLVER_API_KEY=${AUTH_KEY}
      - ZALO_SERVER_API_KEY=${AUTH_KEY}
      - VNC_PASSWORD=${VNC_PASSWORD}
      - CHATGPT2API_BASE_URL=https://gpt.vhtatn.io.vn
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/version')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── MySQL cho console xiaozhi (riêng, KHÔNG chung Postgres của c2a) ────────
  xiaozhi-esp32-server-db:
    image: mysql:latest
    container_name: xiaozhi-esp32-server-db
    restart: unless-stopped
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - MYSQL_ROOT_PASSWORD=${XZ_DB_PASSWORD:-123456}
      - MYSQL_DATABASE=xiaozhi_esp32_server
      - MYSQL_INITDB_ARGS=--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - /opt/c2a/data/xiaozhi/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  xiaozhi-esp32-server-redis:
    image: redis:8.0
    container_name: xiaozhi-esp32-server-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  # ── Console web (智控台) — cấu hình model/giọng/STT/persona qua UI ─────────
  xiaozhi-esp32-server-web:
    image: ghcr.io/xinnan-tech/xiaozhi-esp32-server:web_latest
    container_name: xiaozhi-esp32-server-web
    restart: unless-stopped
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-redis:
        condition: service_healthy
    ports:
      - "8002:8002"     # Console: http://<host>:8002
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SPRING_DATASOURCE_DRUID_URL=jdbc:mysql://xiaozhi-esp32-server-db:3306/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      - SPRING_DATASOURCE_DRUID_USERNAME=root
      - SPRING_DATASOURCE_DRUID_PASSWORD=${XZ_DB_PASSWORD:-123456}
      - SPRING_DATA_REDIS_HOST=xiaozhi-esp32-server-redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=
    volumes:
      - /opt/c2a/data/xiaozhi/uploadfile:/uploadfile
    security_opt:
      - no-new-privileges:true

  # Tự sinh .config.yaml (full-mode: chỉ trỏ manager-api + secret). Không lệnh host.
  xiaozhi-config:
    image: busybox:1.36
    environment:
      - MANAGER_SECRET=${XZ_MANAGER_SECRET:-}
    volumes:
      - /opt/c2a/data/xiaozhi/data:/out
    command:
      - sh
      - -c
      - |
        cat > /out/.config.yaml <<'CFG'
        server:
          ip: 0.0.0.0
          port: 8000
          http_port: 8003
        manager-api:
          url: http://xiaozhi-esp32-server-web:8002/xiaozhi
          secret: "__SECRET__"
        CFG
        sed -i -e "s#__SECRET__#$$MANAGER_SECRET#g" /out/.config.yaml
        echo "[xiaozhi-config] da ghi .config.yaml (full-mode, secret len=$${#MANAGER_SECRET})"

  xiaozhi-server:
    image: ghcr.io/xinnan-tech/xiaozhi-esp32-server:server_latest
    container_name: xiaozhi-esp32-server
    restart: unless-stopped
    depends_on:
      xiaozhi-config:
        condition: service_completed_successfully
      xiaozhi-esp32-server-web:
        condition: service_started
    ports:
      - "8000:8000"     # WebSocket audio — loa nối vào
      - "8003:8003"     # OTA — loa trỏ tới http://<host>:8003/xiaozhi/ota/
    volumes:
      - /opt/c2a/data/xiaozhi/data:/opt/xiaozhi-esp32-server/data
    security_opt:
      - no-new-privileges:true

# =====================================================================
# QUY TRÌNH LẦN ĐẦU (một lần):
# 1) Deploy stack (XZ_MANAGER_SECRET để trống). Chờ web + db + redis xanh.
# 2) Mở console http://<host>:8002 → đăng ký user đầu tiên = super admin.
# 3) Console → 参数管理 (Parameter Management) → tìm 'server.secret' → copy giá trị.
# 4) Đặt XZ_MANAGER_SECRET = giá trị vừa copy vào Environment của stack → Update lại.
#    (xiaozhi-config sinh lại .config.yaml, xiaozhi-server kết nối được manager-api.)
# 5) Trong console → 参数管理:
#      server.websocket = ws://<SERVER_IP>:8000/xiaozhi/v1/
#      server.ota       = http://<SERVER_IP>:8003/xiaozhi/ota/
#    (<SERVER_IP> = IP LAN host — đặt Ở ĐÂY, không cần env nữa.)
# 6) Console → 模型配置 (Model Config):
#      LLM  : kiểu OpenAI → url http://c2a:80/v1/                 , key = AUTH_KEY
#      ASR  : kiểu OpenAI → http://c2a:80/v1/audio/transcriptions  , key = AUTH_KEY
#      TTS  : kiểu OpenAI → http://c2a:80/v1/audio/speech          , key = AUTH_KEY
#      → giờ bạn CHỌN model/giọng/STT/persona bất kỳ ngay trong console.
# 7) Đăng ký thiết bị (theo MAC loa) trong console; trỏ OTA loa tại panel 8081 về
#    http://<SERVER_IP>:8003/xiaozhi/ota/ → reboot → "Alexa".
# =====================================================================
