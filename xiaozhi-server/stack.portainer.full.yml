# =====================================================================
# STACK RIÊNG cho XIAOZHI (module đầy đủ 智控台) — TÁCH KHỎI c2a.
# server + web console + MySQL + Redis. Dán vào Portainer như MỘT STACK RIÊNG.
#
# Vì sao tách: xiaozhi hiếm khi cập nhật, c2a cập nhật thường xuyên — để riêng
# thì update c2a không đụng/không restart xiaozhi.
#
# c2a nằm ở STACK KHÁC → mạng Docker khác → KHÔNG gọi được tên `c2a`. Nên khi
# cấu hình LLM/ASR/TTS trong console, trỏ c2a qua DOMAIN hoặc IP host:
#     https://gpt.vhtatn.io.vn/...      (khuyến nghị — không phụ thuộc IP)
#   hoặc  http://172.16.10.38:3030/...  (LAN, nhanh hơn, không TLS)
#
# Mọi cấu hình (model/giọng/STT/persona/SERVER_IP/URL c2a + key) đặt HẾT trong
# CONSOLE http://<host>:8002. File này chỉ trỏ manager-api + secret.
#
# ⚠️ CHƯA test build được ở đây — dựng bám sát docker-compose_all.yml chính chủ.
#
# Environment của stack này cần:
#   - XZ_DB_PASSWORD    : (tuỳ chọn) mật khẩu MySQL nội bộ; mặc định 123456.
#   - XZ_MANAGER_SECRET : LẤY SAU bước 1 (xem QUY TRÌNH LẦN ĐẦU cuối file).
# (KHÔNG cần AUTH_KEY ở đây — key c2a nhập trong console, không phải stack này.)
#
# MySQL/Redis riêng (c2a là PostgreSQL; console xiaozhi bắt buộc MySQL — không
# chung được). Data để dưới /opt/c2a/data/xiaozhi (chung chỗ backup với c2a, dù
# là stack riêng). Muốn tách hẳn thì đổi thành /opt/xiaozhi.
# =====================================================================

services:
  xiaozhi-esp32-server-db:
    image: mysql:latest
    container_name: xiaozhi-esp32-server-db
    restart: unless-stopped
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - MYSQL_ROOT_PASSWORD=${XZ_DB_PASSWORD:-123456}
      - MYSQL_DATABASE=xiaozhi_esp32_server
      - MYSQL_INITDB_ARGS=--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      # MySQL PHẢI dùng named volume (Docker quản lý) — bind vào thư mục chung
      # của c2a hay gây init lỗi (quyền/dữ liệu dở) → backend 502. Named volume
      # khởi tạo sạch, reset được ngay trong Portainer.
      - xiaozhi-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  xiaozhi-esp32-server-redis:
    image: redis:8.0
    container_name: xiaozhi-esp32-server-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  # Console web (智控台) — cấu hình model/giọng/STT/persona qua UI
  xiaozhi-esp32-server-web:
    image: ghcr.io/xinnan-tech/xiaozhi-esp32-server:web_latest
    container_name: xiaozhi-esp32-server-web
    restart: unless-stopped
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-redis:
        condition: service_healthy
    ports:
      - "8002:8002"     # Console: http://<host>:8002
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SPRING_DATASOURCE_DRUID_URL=jdbc:mysql://xiaozhi-esp32-server-db:3306/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      - SPRING_DATASOURCE_DRUID_USERNAME=root
      - SPRING_DATASOURCE_DRUID_PASSWORD=${XZ_DB_PASSWORD:-123456}
      - SPRING_DATA_REDIS_HOST=xiaozhi-esp32-server-redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=
    volumes:
      - /opt/c2a/data/xiaozhi/uploadfile:/uploadfile
    security_opt:
      - no-new-privileges:true

  # Tự sinh .config.yaml (full-mode: chỉ trỏ manager-api + secret). Không lệnh host.
  xiaozhi-config:
    image: busybox:1.36
    environment:
      - MANAGER_SECRET=${XZ_MANAGER_SECRET:-}
    volumes:
      - /opt/c2a/data/xiaozhi/data:/out
    command:
      - sh
      - -c
      - |
        cat > /out/.config.yaml <<'CFG'
        server:
          ip: 0.0.0.0
          port: 8000
          http_port: 8003
        manager-api:
          url: http://xiaozhi-esp32-server-web:8002/xiaozhi
          secret: "__SECRET__"
        CFG
        sed -i -e "s#__SECRET__#$$MANAGER_SECRET#g" /out/.config.yaml
        echo "[xiaozhi-config] da ghi .config.yaml (full-mode, secret len=$${#MANAGER_SECRET})"

  xiaozhi-server:
    image: ghcr.io/xinnan-tech/xiaozhi-esp32-server:server_latest
    container_name: xiaozhi-esp32-server
    restart: unless-stopped
    depends_on:
      xiaozhi-config:
        condition: service_completed_successfully
      xiaozhi-esp32-server-web:
        condition: service_started
    ports:
      - "8000:8000"     # WebSocket audio — loa nối vào
      - "8003:8003"     # OTA — loa trỏ tới http://<host>:8002/xiaozhi/ota/
    volumes:
      - /opt/c2a/data/xiaozhi/data:/opt/xiaozhi-esp32-server/data
    security_opt:
      - no-new-privileges:true

volumes:
  xiaozhi-mysql:      # MySQL do Docker quản lý (init sạch, reset trong Portainer)

# =====================================================================
# QUY TRÌNH LẦN ĐẦU (một lần):
# 1) Deploy stack (XZ_MANAGER_SECRET để trống). Chờ web + db + redis xanh.
# 2) Mở console http://<host>:8002 → đăng ký user đầu tiên = super admin.
# 3) Console → 参数管理 (Parameter Management) → tìm 'server.secret' → copy giá trị.
# 4) Đặt XZ_MANAGER_SECRET = giá trị vừa copy vào Environment của stack → Update lại.
# 5) Console → 参数管理:
#      server.websocket = ws://<SERVER_IP>:8000/xiaozhi/v1/
#      server.ota       = http://<SERVER_IP>:8002/xiaozhi/ota/
#    (<SERVER_IP> = IP LAN host — đặt Ở ĐÂY, không cần env.)
# 6) Console → 模型配置 (Model Config) — trỏ c2a qua DOMAIN/IP host (KHÔNG dùng
#    tên `c2a` vì khác stack/mạng), key = AUTH_KEY của c2a:
#      LLM : kiểu OpenAI → https://gpt.vhtatn.io.vn/v1/
#      ASR : kiểu OpenAI → https://gpt.vhtatn.io.vn/v1/audio/transcriptions
#      TTS : kiểu OpenAI → https://gpt.vhtatn.io.vn/v1/audio/speech
#      → giờ CHỌN model/giọng/STT/persona bất kỳ trong console.
# 7) Đăng ký thiết bị (theo MAC loa) trong console; trỏ OTA loa (panel 8081) về
#    http://<SERVER_IP>:8002/xiaozhi/ota/ → reboot → "Alexa".
# =====================================================================
