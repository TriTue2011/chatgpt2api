# =====================================================================
# THAM KHẢO — hai service này ĐÃ có sẵn trong docker-compose.yml chính của repo.
# Chỉ dùng file này nếu bạn dán tay vào một stack Portainer riêng.
#
# ⚠️ Bind mount `./xiaozhi-server` cần file repo có mặt trên host. Trong Portainer,
# hãy dùng **Stack từ Git repository** (Portainer tự kéo repo → có sẵn thư mục),
# hoặc copy thư mục xiaozhi-server/ lên host rồi sửa đường dẫn cho khớp.
#
# .env cần: CHATGPT2API_AUTH_KEY (giống c2a) và SERVER_IP=<IP LAN host>.
# =====================================================================

  xiaozhi-config:
    image: busybox:1.36
    environment:
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:?dat trong .env}
      SERVER_IP: ${SERVER_IP:?dat SERVER_IP=IP_LAN_cua_host trong .env}
    volumes:
      - ./xiaozhi-server:/tpl:ro
      - xiaozhi-data:/out
    command: ["sh", "/tpl/render-config.sh"]

  xiaozhi-server:
    image: ghcr.io/xinnan-tech/xiaozhi-esp32-server:server_latest
    container_name: xiaozhi-esp32-server
    restart: unless-stopped
    depends_on:
      xiaozhi-config:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
      - "8003:8003"
    volumes:
      - xiaozhi-data:/opt/xiaozhi-esp32-server/data
    security_opt:
      - no-new-privileges:true

# Nhớ khai volume ở ngoài cùng:
# volumes:
#   xiaozhi-data:
