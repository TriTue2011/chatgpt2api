# =====================================================================
# MẪU cấu hình xiaozhi-server. Service `xiaozhi-config` trong docker-compose
# tự thay __AUTH_KEY__ và __SERVER_IP__ rồi ghi ra .config.yaml lúc khởi động.
# KHÔNG chứa bí mật → commit an toàn. Không sửa tay file này khi chạy bằng compose.
#
# LLM/STT/TTS trỏ qua tên nội bộ `c2a` (cùng compose network) → chạy trên MỌI
# máy, không phụ thuộc IP. Chỉ `websocket` cần IP LAN thật (SERVER_IP) vì LOA
# là thiết bị ngoài, phải quay số tới host.
# =====================================================================

server:
  ip: 0.0.0.0
  port: 8000
  http_port: 8003
  websocket: ws://__SERVER_IP__:8000/xiaozhi/v1/
  vision_explain: http://__SERVER_IP__:8003/mcp/vision/explain

selected_module:
  VAD: SileroVAD
  ASR: OpenaiASR         # → c2a /v1/audio/transcriptions (Zipformer tiếng Việt)
  LLM: C2A               # → c2a /v1/chat/completions
  TTS: OpenAITTS         # → c2a /v1/audio/speech (VieNeu tiếng Việt)
  Intent: function_call  # ← MCP tool của loa (âm lượng, nhạc, đèn...) gọi ở đây
  Memory: nomem

LLM:
  C2A:
    type: openai
    model_name: gpt-4o
    url: http://c2a:80/v1/
    api_key: "__AUTH_KEY__"

ASR:
  OpenaiASR:
    type: openai
    base_url: http://c2a:80/v1/audio/transcriptions
    api_key: "__AUTH_KEY__"
    model_name: whisper-1
    output_dir: tmp/

TTS:
  OpenAITTS:
    type: openai
    api_url: http://c2a:80/v1/audio/speech
    api_key: "__AUTH_KEY__"
    model: tts-1
    voice: ""            # trống = giọng mặc định đặt trong web UI c2a
    speed: 1
    output_dir: tmp/
