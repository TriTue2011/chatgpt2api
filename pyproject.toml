[project]
name = "chatgpt2api"
# Đồng bộ tay với file VERSION khi bump release (runtime đọc động từ VERSION).
version = "1.5.0"
description = "Self-hosted AI gateway: OpenAI/Anthropic-compatible API over ChatGPT web, Codex OAuth, Gemini, Claude and 20+ providers with account pooling, combo routing and Home Assistant integration."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.15.0",
    # Tải video từ link về để ghép phụ đề / lồng tiếng (services/video_tai.py).
    # Đường phụ đề-sẵn-có của video_dich không cần gói này; chỉ khi người dùng
    # muốn nhận lại VIDEO thì mới phải có tệp hình trong tay.
    #
    # SÀN PHẢI NÂNG THEO THỜI GIAN, không để nguyên "2025.1.15" được: YouTube
    # đổi cách ký URL vài tuần một lần, bản yt-dlp cũ hơn đợt đổi thì lấy được
    # danh sách format nhưng tải là dính "HTTP Error 403: Forbidden". Đo thật
    # 20/08/2026 trên cả máy chủ lẫn máy dev: 2026.7.4 (bản image đang chạy)
    # hỏng 403, 2026.8.19 tải trơn — nên đây là hỏng theo phiên bản, không phải
    # do IP máy chủ bị chặn.
    #
    # Lần sau gặp 403 thì việc cần làm là: uv lock --upgrade-package yt-dlp,
    # rồi dựng lại image (image cài từ uv.lock, sửa mỗi pyproject là không ăn).
    "yt-dlp>=2026.8.19",
    "fastapi>=0.136.0",
    # JSON nhanh (ORJSONResponse mặc định của app — gateway stream JSON lớn liên tục)
    "orjson>=3.10.0",
    "pillow>=12.2.0",
    # Ảnh iPhone (HEIC/HEIF) + AVIF: Pillow trần không mở được → vision chết với
    # "cannot identify image file". services/image_utils.py tự nạp plugin này.
    "pillow-heif>=1.1.0",
    "pybase64>=1.4.3",
    # video_asr đo năng lượng WAV bằng mảng float32; trước đây image có thể
    # dựng sạch mà thiếu NumPy, tới lúc người dùng gửi video mới nổ import.
    "numpy>=2.0",
    "python-multipart>=0.0.26",
    "tiktoken>=0.12.0",
    "uvicorn>=0.44.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "gitpython>=3.1.57",
    "gemini-webapi>=2.0.0",
    "cryptography>=50.0.0",
    # Giọng nói: STT chạy local (Zipformer) + phát ra loa Google Cast.
    # Model KHÔNG nằm trong image — tải về volume bằng script (xem voices/).
    "sherpa-onnx>=1.12.0",
    "pychromecast>=14.0.0",
    # PDF số → Markdown: lõi Rust chạy TRONG tiến trình (PyO3), không gọi dịch
    # vụ nào. Có wheel dựng sẵn cho manylinux x86_64 + aarch64 (abi3, CPython
    # ≥3.8) nên image không cần thêm toolchain Rust. Xem pdf_intent.markdown_pdf_so.
    "pdf-inspector>=0.2.6",
    # Office/EPUB (.docx/.pptx/.xlsx/.odt/.rtf/.epub) → Markdown. CÙNG NHÀ với
    # pdf-inspector ở trên và cùng một kiểu: lõi Rust trong tiến trình, wheel
    # abi3 dựng sẵn cho manylinux x86_64 + aarch64 nên image không cần Rust.
    # Đặt trước markitdown vì markitdown nối chữ từng đoạn nên mất bảng;
    # markitdown vẫn ở lại làm đường lùi cho .xls nhị phân cũ và .html.
    # Xem pdf_intent.markdown_office_so.
    #
    # GHIM Ở 0.1.8, ĐỪNG BUMP LÊN 0.1.9 CHO ĐẸP: index mặc định của dự án là
    # mirror Aliyun (xem [[tool.uv.index]] cuối file) và mirror đó chậm hơn
    # pypi.org vài ngày. Docker cài bằng `uv sync --frozen`, nên đòi một bản
    # mirror chưa có là VỠ BUILD chứ không phải cài bản cũ hơn. API hai bản y
    # nhau (đã so `_anydoc.pyi`: to_markdown / to_markdown_bytes / to_document).
    "firecrawl-anydoc>=0.1.8",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    # Chỉ để CHẠY TEST host-key SSH. Runtime lấy paramiko từ
    # deploy/extra-requirements.txt; Dockerfile dùng `uv sync --no-dev` nên
    # nhóm này không vào image.
    "paramiko>=3.4.0",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q"
markers = [
    "pure: pure unit — no external seams",
    "adapter: uses shared fakes from test._fakes only",
    "integration: real cheap libs (fitz/tmp), no paid API",
    "e2e: real HA/bot/provider/device — use --run-e2e",
]
# Default CI: prefer pure+adapter when selecting explicitly:
#   pytest -m "pure or adapter"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

# RIÊNG yt-dlp lấy thẳng pypi.org, không qua mirror. Lý do: gói này BẮT BUỘC
# phải mới — YouTube đổi cách ký URL vài tuần một lần, bản cũ hơn đợt đổi là
# tải dính 403 (xem chú thích ở phần dependencies). Mirror Aliyun chậm hơn
# pypi.org vài ngày và trong quãng đó nó chỉ có bản nightly `.devN`, nên bám
# mirror thì hoặc phải chờ, hoặc phải cài bản chưa phát hành chính thức.
# Đo 20/08/2026: pypi.org đã có 2026.8.19 (bản chữa 403) trong khi mirror mới
# tới 2026.8.18.122307.dev0.
# `explicit = true` là BẮT BUỘC, không phải cho gọn: thiếu nó thì index này
# được hỏi TRƯỚC index mặc định cho mọi gói, và cả 62 gói trong uv.lock chuyển
# hết sang pypi.org — mất luôn mirror mà chủ máy đã chọn. Có cờ này thì index
# chỉ phục vụ đúng gói nào trỏ tới nó trong [tool.uv.sources].
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[tool.uv.sources]
gemini-webapi = { git = "https://github.com/luuquangvu/Gemini-API.git", rev = "b38110e82fe0e41bbf53a03646ef87ddc88a996a" }
yt-dlp = { index = "pypi" }
