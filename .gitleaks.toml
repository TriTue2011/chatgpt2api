# Gitleaks config — chặn commit lộ secret (rule-first, offline, chạy pre-commit + CI).
# Kế thừa bộ rule mặc định của Gitleaks rồi bổ sung allowlist cho placeholder.
[extend]
useDefault = true

# Rule riêng: auth key nội bộ gán thẳng trong code/URL (sự cố đã xảy ra — chặn tái diễn).
#
# GIÁ TRỊ mới là thứ bị soi, không phải cả dòng (`secretGroup = 2`) — nhờ vậy
# allowlist bên dưới lọc được theo đúng giá trị.
#
# Vì sao siết lại (đo thật 03/08, bản quét sâu định kỳ trên main): luật cũ nhận
# BẤT KỲ phép gán nào dài ≥7 ký tự sau `api_key/auth_key/...`, nên nó bắt cả
# `api_key = os.getenv(...)`, `cfg.api_key = keysArr[0]`, `has_api_key: boolean`,
# `_BEARER = re.compile(...)`. Kết quả: 62/65 phát hiện là mã bình thường. Một
# cổng bảo mật lúc nào cũng đỏ vì báo nhầm thì người ta ngừng đọc nó — đó mới là
# rủi ro thật.
#
# Ba điều kiện giữ lại sức bắt: giá trị dài ≥16 ký tự (khoá thật đều dài),
# KHÔNG có \b ở đầu (tên biến thật là `CHATGPT2API_AUTH_KEY`, ký tự trước "AUTH"
# là '_' nên \b trượt), và nuốt được cả dạng JSON `"Authorization": "Bearer <token>"`.
[[rules]]
id = "chatgpt2api-inline-authkey"
description = "Auth key gán thẳng trong code/URL"
regex = '''(?i)(api[_-]?key|auth[_-]?key|access[_-]?token|authorization|bearer)\b["']?\s*(?:[:=]|\s)\s*["']?(?:bearer\s+)?([A-Za-z0-9][A-Za-z0-9@#$%._-]{15,})["']?'''
secretGroup = 2
keywords = ["api_key", "apikey", "auth_key", "authkey", "access_token", "authorization", "bearer"]

[allowlist]
description = "Placeholder/ví dụ và phép gán từ biến — không phải secret thật"
regexes = [
  '''(?i)your[_-]''',
  '''ghp_x+''',
  '''sk-[x]{8,}''',
  '''mat_khau_cua_ban''',
  # Job token ví dụ trong fw-tach-am/README.md. Tài liệu đã đổi sang sinh ngẫu
  # nhiên tại chỗ, nhưng gitleaks quét CẢ LỊCH SỬ (fetch-depth: 0) nên chuỗi cũ
  # ở commit cc0a609 vẫn làm đỏ CI mãi nếu không khai ở đây.
  '''thu[_-]?nghiem[_-]?\d+''',
  '''example|placeholder|changeme|xxxx|<[a-z-]+>''',
  # Khoá giá vàng BTMC. KHÔNG phải bí mật của dự án này: chính BTMC đăng nó
  # trong tài liệu API công khai (btmc.vn/thong-tin/tai-lieu-api/api-gia-vang-
  # 17784.html) để mọi người cùng gọi. Không có gì để thu hồi và cũng không ai
  # thu hồi được ngoài BTMC. Kiểm chứng 17/08/2026.
  '''3kd8ub1llcg9t45hnoh8hmn7t5kc2v''',
  # Placeholder trong README và docs — chính là chỗ bảo người đọc thay bằng giá
  # trị thật. Viết bám đúng lối đặt tên đang dùng chứ không nới rộng luật:
  # `khoa_..._manh`, `mat_khau_..._manh`, `strong_..._key`, `chuoi_ngau_nhien...`.
  '''^(khoa|mat_khau)_[a-z0-9_]*manh$''',
  '''^strong_[a-z0-9_]*key$''',
  '''^chuoi_ngau_nhien''',
  # Không phải khoá: base64 của {"name":"auth0-spa-js","version":"1.21.0"} —
  # header nhận dạng thư viện mà Auth0 SPA JS gắn vào mỗi request.
  '''^eyJuYW1lIjoiYXV0aDAtc3BhLWpz''',
  # Khớp vắt qua xuống dòng rồi nuốt trúng TÊN HÀM ở dòng sau
  # (`if api_key:` → newline → `mark_key_limited`). Là mã bình thường, không
  # phải giá trị. Chỉ tha đúng tên này thay vì tha mọi định danh trần.
  '''^mark_key_limited$''',
  # Gán từ BIẾN hoặc LỜI GỌI HÀM chứ không phải chuỗi cứng:
  # `os.environ.get`, `module.os.environ.get`, `settings.get_config`.
  '''^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)+$''',
]
paths = [
  '''\.env\.example$''',
  '''(^|/)test/''',
  '''package-lock\.json$''',
  '''\.gitleaks\.toml$''',
]
