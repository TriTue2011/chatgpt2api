# Stack MÁY GPU — nghe + dịch theo lô, dùng chung một card NVIDIA
# (vision Qwen3-VL nằm ở docker-compose.vision.yml — stack RIÊNG) (ở nhà: máy NVR
# 172.16.10.220, RTX 2060 Super 8 GB). KHÔNG nằm trong stack c2a; gateway trên
# máy khác gọi sang qua LAN.
#
#   docker compose up -d          # kéo image từ ghcr, không build gì
#
# Máy này KHÔNG có watchtower (khác stack c2a): lên bản mới là
# `docker compose pull && docker compose up -d`.
#
# Cần sẵn trên máy: driver NVIDIA + nvidia-container-toolkit. Compose không cài
# hộ được hai thứ đó.
#
# DỮ LIỆU nằm ở /opt/gpu-box/<dịch vụ> (bind mount, không phải named volume) —
# nhìn thấy và sao lưu được bằng lệnh thường, không phải lục
# /var/lib/docker/volumes. Tạo trước khi Deploy:
#
#   mkdir -p /opt/gpu-box/{fw-nghe,vn-translate-gpu}
#
# Không phải chown tay: fw-nghe và fw-vision chạy bằng root, còn entrypoint của
# vn-translate tự `chown /data` rồi mới hạ quyền xuống uid 1033.
#
# Đang chạy bằng named volume mà muốn chuyển sang đây thì chép sang cho khỏi
# tải lại 3 GB model nghe (dừng container trước):
#
#   cp -a /var/lib/docker/volumes/fw-nghe-data/_data/.          /opt/gpu-box/fw-nghe/
#   cp -a /var/lib/docker/volumes/vn-translate-gpu-data/_data/. /opt/gpu-box/vn-translate-gpu/
#
# Khai ở gateway (service c2a) sau khi chạy:
#   NGHE_URL_GPU:     http://<ip-máy-gpu>:5002
#   TRANSLATE_URL_LO: http://<ip-máy-gpu>:5001
services:
  # Nghe (faster-whisper large-v3) — chỉ tiếng mà model tại chỗ bỏ trắng đoạn
  # (mặc định en, ko) mới gửi sang đây. Xem fw-nghe/README.md.
  fw-nghe:
    image: ghcr.io/tritue2011/fw-nghe:latest
    container_name: fw-nghe
    restart: unless-stopped
    ports:
      - "5002:5000"
    environment:
      FW_MODEL: "large-v3"
      # Card compute capability ≥ 7.0 (2060S = 7.5) mới chạy được float16;
      # card cũ hơn (vd GTX 1080, CC 6.1) đổi thành "int8".
      FW_COMPUTE: "int8_float16"
    volumes:
      - /opt/gpu-box/fw-nghe:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # Image nền CUDA + Ubuntu chỉ có `python3`, không có alias `python`.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=5)\""]
      interval: 30s
      timeout: 6s
      retries: 3
      # Lần đầu tải model large-v3 (~3 GB) rồi mới mở cổng.
      start_period: 600s
    security_opt:
      - no-new-privileges:true

  # Dịch theo LÔ (phụ đề phim, tài liệu dài). Câu lẻ vẫn đi bản CPU trong stack
  # c2a — GPU thua CPU khi dịch một câu, định tuyến ở translate_service.py.
  vn-translate-gpu:
    image: ghcr.io/tritue2011/vn-translate-gpu:latest
    container_name: vn-translate-gpu
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      TT_LANGS: "en,vi,ja,ko,zh-Hans"
      TT_KIEU_TINH: "float16"
      # Lô đưa vào model mỗi lượt decode: 64 trên GPU (16 là mức cho CPU).
      TT_LO_MODEL: "64"
    volumes:
      - /opt/gpu-box/vn-translate-gpu:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=5)\""]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 300s
    security_opt:
      - no-new-privileges:true
